# ===============================
# SERVER CONFIGURATION
# ===============================

server.port=8080

# ===============================
# APPLICATION NAME
# ===============================

spring.application.name=project-manager-api

# ===============================
# MYSQL DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/project_manager
spring.datasource.username=root
spring.datasource.password=piyush@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=MySecretKeyMySecretKeyMySecretKey12345
jwt.expiration.ms=86400000

# ===============================
# LOGGING
# ===============================

logging.level.project_manager_api=INFO
logging.level.org.springframework.security=WARN